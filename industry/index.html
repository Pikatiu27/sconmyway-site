<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industry Updates</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff8ed;
      --ink: #22303a;
      --muted: #67727a;
      --line: rgba(70, 88, 98, 0.16);
      --panel: rgba(255, 255, 255, 0.9);
      --mint: #9bdac8;
      --peach: #ffc8a8;
      --sky: #a9d8ff;
      --lemon: #ffe89a;
      --rose: #f7b7c8;
      --lavender: #cfc3ff;
      --shadow: 0 18px 42px rgba(76, 97, 112, 0.14);
      --soft-shadow: 0 10px 28px rgba(76, 97, 112, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", "Noto Sans SC", "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .phone {
      position: relative;
      width: min(100%, 520px);
      min-height: 100svh;
      background: linear-gradient(180deg, #fffaf1 0%, #f3fbff 44%, #fff7fb 100%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 11px 14px 11px 18px;
      background: rgba(255, 250, 241, 0.9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 0;
      font-size: 16px;
      font-weight: 780;
      line-height: 1;
    }

    .date {
      color: var(--muted);
      font-size: 11.5px;
      white-space: nowrap;
    }

    .lang-toggle {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      width: 74px;
      height: 30px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
    }

    .lang-toggle button {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 11.5px;
      font-weight: 760;
      line-height: 1;
      cursor: pointer;
    }

    .lang-toggle button.active {
      background: var(--ink);
      color: white;
    }

    .hero {
      position: relative;
      min-height: 315px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      background: #d9f0ff;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.82;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 250, 241, 0.2), rgba(117, 153, 171, 0.16) 44%, rgba(34, 48, 58, 0.5));
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      padding: 24px 20px 28px;
      color: white;
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.4);
    }

    .eyebrow {
      display: none;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(38px, 10vw, 54px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: 0;
    }

    .deck {
      display: none;
    }

    .watermark {
      position: absolute;
      right: 14px;
      bottom: 12px;
      z-index: 2;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.64);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(20, 30, 36, 0.22);
    }

    main {
      padding: 18px 12px 34px;
    }

    section {
      margin: 0 0 24px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 12px;
    }

    h2 {
      margin: 0;
      font-size: 20.5px;
      line-height: 1.16;
      font-weight: 820;
      letter-spacing: 0;
    }

    .count {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border: 1px solid rgba(70, 88, 98, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .lead-card {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      border-radius: 8px;
      overflow: hidden;
    }

    .ticker {
      display: grid;
    }

    .news-row {
      min-height: 108px;
      display: block;
      padding: 16px 13px;
      border-bottom: 1px solid var(--line);
    }

    .news-row:last-child { border-bottom: 0; }

    .topic,
    .area,
    .class-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 8px;
      border-radius: 999px;
      color: #22303a;
      font-size: 11.5px;
      font-weight: 780;
      line-height: 1;
      white-space: nowrap;
    }

    .topic.ai { background: var(--mint); }
    .topic.robot { background: var(--sky); }
    .topic.chip { background: var(--lemon); }
    .topic.trade { background: var(--peach); }
    .topic.bio { background: var(--rose); }
    .topic.crypto { background: var(--lavender); }

    .headline {
      margin: 9px 0 0;
      font-size: 16.8px;
      line-height: 1.34;
      font-weight: 780;
    }

    .summary {
      margin: 8px 0 0;
      color: #3b4a54;
      font-size: 14.5px;
      line-height: 1.72;
      font-weight: 500;
    }

    .watch {
      margin: 10px 0 0;
      padding-left: 10px;
      border-left: 2px solid rgba(169, 216, 255, 0.92);
      color: #53636c;
      font-size: 13px;
      line-height: 1.62;
      font-weight: 500;
    }

    .insight-list {
      display: grid;
      gap: 12px;
    }

    .insight-item,
    .classroom {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      padding: 16px 14px;
    }

    .area {
      margin: 0 0 9px;
      background: rgba(155, 218, 200, 0.46);
      color: #28745f;
      font-weight: 820;
    }

    .signal,
    .class-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.36;
      font-weight: 790;
    }

    .why {
      margin: 10px 0 0;
      padding: 10px 11px;
      border-radius: 8px;
      background: rgba(169, 216, 255, 0.22);
      color: #3b4a54;
      font-size: 13.8px;
      line-height: 1.62;
      font-weight: 500;
    }

    .evidence,
    .caveat {
      margin: 9px 0 0;
      color: #5c6d76;
      font-size: 12.7px;
      line-height: 1.62;
      font-weight: 500;
    }

    .evidence {
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(70, 88, 98, 0.08);
    }

    .caveat {
      padding-left: 10px;
      border-left: 2px solid rgba(255, 192, 122, 0.82);
    }

    .ref {
      margin: 12px 0 0;
      padding-top: 9px;
      border-top: 1px solid rgba(70, 88, 98, 0.1);
      color: var(--muted);
      font-size: 11.2px;
      line-height: 1.48;
      font-weight: 520;
    }

    .ref-label {
      font-weight: 720;
    }

    .ref-links {
      display: inline;
    }

    .ref-link {
      color: #2d7081;
      text-decoration: underline;
      text-decoration-color: rgba(45, 112, 129, 0.34);
      text-underline-offset: 2px;
      overflow-wrap: anywhere;
    }

    .ref-link:hover,
    .ref-link:focus-visible {
      color: #15576a;
      text-decoration-color: currentColor;
    }

    .ref-separator {
      color: rgba(79, 95, 104, 0.52);
    }

    .classroom {
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--soft-shadow);
    }

    .class-label {
      margin: 0 0 9px;
      background: rgba(255, 232, 154, 0.6);
      color: #746124;
      font-weight: 820;
    }

    .class-title {
      color: var(--ink);
      font-size: 18px;
      line-height: 1.38;
      font-weight: 820;
    }

    .class-text {
      margin: 8px 0 0;
      color: #3b4a54;
      font-size: 14.5px;
      line-height: 1.72;
      font-weight: 500;
    }

    .compare-title {
      margin: 18px 0 6px;
      color: #5f6f77;
      font-size: 12.2px;
      line-height: 1.45;
      font-weight: 820;
    }

    .compare-list {
      margin-top: 2px;
      border-top: 1px solid rgba(70, 88, 98, 0.1);
    }

    .compare-row {
      display: grid;
      grid-template-columns: minmax(78px, 104px) 1fr;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(70, 88, 98, 0.1);
    }

    .compare-key,
    .compare-copy {
      margin: 0;
    }

    .compare-key {
      color: #28745f;
      font-size: 12.5px;
      line-height: 1.55;
      font-weight: 800;
    }

    .compare-copy {
      color: #3b4a54;
      font-size: 14.2px;
      line-height: 1.72;
      font-weight: 500;
    }

    .design-takeaway {
      margin: 14px 0 0;
      padding: 11px 12px;
      border-left: 4px solid rgba(255, 192, 122, 0.92);
      background: rgba(255, 232, 154, 0.22);
    }

    .design-takeaway-label,
    .design-takeaway-text {
      margin: 0;
    }

    .design-takeaway-label {
      color: #746124;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 850;
    }

    .design-takeaway-text {
      margin-top: 5px;
      color: #3b4a54;
      font-size: 14.2px;
      line-height: 1.72;
      font-weight: 560;
    }

    .example-block {
      margin: 18px -14px 0;
      padding: 18px 14px 7px;
      border-top: 2px solid rgba(91, 169, 194, 0.38);
      background: rgba(169, 216, 255, 0.17);
    }

    .example-label {
      margin: 0 0 10px;
    }

    .example-title {
      margin: 0;
      color: #183744;
      font-size: 17px;
      line-height: 1.4;
      font-weight: 800;
    }

    .example-intro {
      margin: 10px 0 0;
      color: #4c5d66;
      font-size: 14.2px;
      line-height: 1.72;
      font-weight: 500;
    }

    .equation-list {
      margin-top: 14px;
      border-top: 1px solid rgba(44, 95, 112, 0.15);
    }

    .equation-row {
      display: grid;
      grid-template-columns: minmax(96px, 124px) minmax(0, 1fr);
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(44, 95, 112, 0.13);
    }

    .equation-key,
    .equation-result {
      margin: 0;
    }

    .equation-key {
      padding-top: 9px;
      color: #236479;
      font-size: 12.8px;
      line-height: 1.55;
      font-weight: 820;
    }

    .equation-body {
      min-width: 0;
    }

    .equation-formula {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid rgba(70, 139, 160, 0.24);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.94);
      color: #143746;
      font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
      font-size: 16.2px;
      line-height: 1.5;
      font-weight: 650;
      letter-spacing: 0;
      text-align: center;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      overflow-wrap: normal;
      word-break: normal;
      -webkit-overflow-scrolling: touch;
    }

    .math-var {
      font-style: italic;
    }

    .equation-formula sub,
    .equation-formula sup {
      position: relative;
      vertical-align: baseline;
      font-size: 0.68em;
      line-height: 0;
    }

    .equation-formula sub {
      bottom: -0.28em;
    }

    .equation-formula sup {
      top: -0.48em;
    }

    .equation-result {
      margin-top: 8px;
      color: #4c5d66;
      font-size: 14.2px;
      line-height: 1.72;
      font-weight: 500;
    }

    .equation-citation {
      margin: 8px 2px 0;
      padding-left: 9px;
      border-left: 3px solid rgba(91, 169, 194, 0.45);
      color: #4c6a73;
      font-size: 11.8px;
      line-height: 1.55;
      font-weight: 620;
    }

    .example-conclusion {
      margin: 15px 0 8px;
      padding: 12px 12px 12px 13px;
      border-left: 4px solid #5ba9c2;
      background: rgba(255, 255, 255, 0.72);
    }

    .example-conclusion-label,
    .example-conclusion-text {
      margin: 0;
    }

    .example-conclusion-label {
      color: #236479;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 850;
    }

    .example-conclusion-text {
      margin-top: 5px;
      color: #29444f;
      font-size: 14.2px;
      line-height: 1.72;
      font-weight: 620;
    }

    .classroom .ref {
      font-size: 12px;
      line-height: 1.62;
      font-weight: 560;
    }

    .classroom .ref-link {
      font-weight: 650;
    }

    html[lang="zh-CN"] .summary,
    html[lang="zh-CN"] .why,
    html[lang="zh-CN"] .watch,
    html[lang="zh-CN"] .evidence,
    html[lang="zh-CN"] .caveat,
    html[lang="zh-CN"] .class-text,
    html[lang="zh-CN"] .compare-copy,
    html[lang="zh-CN"] .design-takeaway-text,
    html[lang="zh-CN"] .example-intro,
    html[lang="zh-CN"] .equation-result,
    html[lang="zh-CN"] .example-conclusion-text {
      text-align: justify;
      text-align-last: left;
      text-justify: inter-ideograph;
      word-break: normal;
      overflow-wrap: break-word;
    }

    html[lang="en"] .summary,
    html[lang="en"] .why,
    html[lang="en"] .watch,
    html[lang="en"] .evidence,
    html[lang="en"] .caveat,
    html[lang="en"] .class-text,
    html[lang="en"] .compare-copy,
    html[lang="en"] .design-takeaway-text,
    html[lang="en"] .example-intro,
    html[lang="en"] .equation-result,
    html[lang="en"] .example-conclusion-text {
      text-align: justify;
      text-align-last: left;
      hyphens: none;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .footer-note {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
      padding: 6px 18px 22px;
    }

    .signature {
      margin: 0;
      padding: 0 18px 16px;
      text-align: center;
      color: rgba(22, 22, 22, 0.28);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .compare-row,
      .equation-row {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .equation-key {
        padding-top: 0;
      }
    }

    @media (max-width: 370px) {
      header {
        grid-template-columns: 1fr auto;
      }

      .date {
        display: none;
      }

      .news-row {
        padding-inline: 11px;
      }
    }

    @media (min-width: 780px) {
      .app {
        padding: 28px 0;
      }

      .phone {
        min-height: auto;
        border-radius: 18px;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="phone">
      <header>
        <div class="brand">Industry Updates</div>
        <div class="date" id="today">Loading</div>
        <div class="lang-toggle" aria-label="Language switch">
          <button type="button" id="langZh" class="active">中</button>
          <button type="button" id="langEn">EN</button>
        </div>
      </header>

      <article class="hero">
        <img src="industry-cover.png" alt="Industry briefing cover">
        <div class="hero-copy">

          <p class="deck" id="heroDeck">实时行业消息、结构工程视角的职业洞察，以及一条跨规范课堂笔记。</p>
        </div>
        <div class="watermark">SConmyway</div>
      </article>

      <main>
        <section>
          <div class="section-head">
            <h2 id="liveTitle">实时消息</h2>
            <span class="count" id="liveCount">3 updates</span>
          </div>
          <div class="lead-card ticker" id="liveUpdates"></div>
        </section>

        <section>
          <div class="section-head">
            <h2 id="insightTitle">专业趋势洞察</h2>
            <span class="count" id="insightCount">3 insights</span>
          </div>
          <div class="insight-list" id="insights"></div>
        </section>

        <section>
          <div class="section-head">
            <h2 id="classroomTitle">中外设计课堂</h2>
          </div>
          <div class="classroom" id="classroom"></div>
        </section>
      </main>

      <p class="footer-note" id="footerNote">内容每日更新，资料来源见各条 Reference。</p>
      <p class="signature">SConmyway</p>
    </div>
  </div>

                  "en": "Bolted steel connections are often misunderstood as safe once bolt shear strength is adequate. That is already incomplete for ordinary bearing connections; for friction-type or slip-resistant connections it can directly mislead design. A slip-resistant connection is usually intended not to let the bolt shank immediately bear against the hole, but to clamp the plates with high-strength bolt preload so that friction between faying surfaces prevents relative movement at a specified load level. The controlling variables therefore include bolt preload, surface preparation, slip coefficient, number of friction planes, hole type, ply thickness, coating cure, tightening method, inspection, and any concurrent tension. Chinese, Australian, European, and U.S. systems express this differently. Chinese practice emphasises high-strength friction-type bolting, testing of the anti-slip coefficient of connected surfaces, and construction acceptance. AS 4100 uses categories such as 8.8/TF and 10.9/TF to connect high-strength friction grip bolting with service-stage slip control. Eurocode 3 classifies preloaded bolted joints by serviceability or ultimate slip resistance and organises the check through slip factor, hole coefficient, and partial factor. The AISC/RCSC system distinguishes snug-tight, pretensioned, and slip-critical joints, with strong emphasis on faying-surface class and qualified coatings. In cross-system review, the key is not to apply a bolt shear table to a slip-resistant joint, but to confirm whether slip is treated as a serviceability limit, an ultimate limit, or a detailing requirement. If the faying surface is wrongly coated, preload is not verified, or the hole type does not match the coefficient used, unacceptable slip can occur before strength failure."

          const sub = token.sub !== undefined ? `<sub>${escapeHtml(token.sub)}</sub>` : "";
          const sup = token.sup !== undefined ? `<sup>${escapeHtml(token.sup)}</sup>` : "";

        <p class="compare-title">${escapeHtml(copy[lang].comparisonLabel)}</p>
        <div class="compare-list">
          ${comparisonPoints.map(point => `
            <div class="compare-row">
              <p class="compare-key">${escapeHtml(pick(point.label))}</p>
              <p class="compare-copy">${escapeHtml(pick(point.text))}</p>
            </div>
          `).join("")}
        </div>
      ` : "";
      const takeaway = item.takeaway ? `
        <div class="design-takeaway">
          <p class="design-takeaway-label">${escapeHtml(copy[lang].takeawayLabel)}</p>
          <p class="design-takeaway-text">${escapeHtml(pick(item.takeaway))}</p>
        </div>
      ` : "";
      const example = item.example ? `
        <section class="example-block">
          <p class="class-label example-label">${escapeHtml(copy[lang].exampleLabel)}</p>
          <h4 class="example-title">${escapeHtml(pick(item.example.title))}</h4>
          <p class="example-intro">${escapeHtml(pick(item.example.intro))}</p>
          <div class="equation-list">
            ${(Array.isArray(item.example.equations) ? item.example.equations : []).map(equation => `
              <div class="equation-row">
                <p class="equation-key">${escapeHtml(pick(equation.label))}</p>
                <div class="equation-body">
                  <div class="equation-formula" role="math" aria-label="${escapeHtml(equation.formula)}">${renderFormula(equation)}</div>
                  ${equation.citation ? `<p class="equation-citation">${escapeHtml(pick(equation.citation))}</p>` : ""}
                  ${pick(equation.result) ? `<p class="equation-result">${escapeHtml(pick(equation.result))}</p>` : ""}
                </div>
              </div>
            `).join("")}
          </div>
          <div class="example-conclusion">
            <p class="example-conclusion-label">${escapeHtml(copy[lang].conclusionLabel)}</p>
            <p class="example-conclusion-text">${escapeHtml(pick(item.example.note))}</p>
          </div>
        </section>
      ` : "";

      document.querySelector("#classroom").innerHTML = `
        <p class="class-label">${escapeHtml(copy[lang].classroomLabel)}</p>
        <h3 class="class-title">${escapeHtml(pick(item.title))}</h3>
        <p class="class-text">${escapeHtml(pick(item.text))}</p>
        ${comparison}
        ${takeaway}
        ${example}
        ${renderReference(item)}
      `;
    }

    function setLanguage(nextLang) {
      lang = nextLang;
      localStorage.setItem("industryUpdatesLang", lang);
      document.documentElement.lang = copy[lang].htmlLang;
      document.querySelector("#langZh").classList.toggle("active", lang === "zh");
      document.querySelector("#langEn").classList.toggle("active", lang === "en");
      render();
    }

    function render() {
      document.querySelector("#today").textContent = formatDate(dailyData.date);
      document.querySelector("#edition").textContent = pick(dailyData.edition);
      document.querySelector("#heroTitle").textContent = copy[lang].heroTitle;
      document.querySelector("#heroDeck").textContent = copy[lang].heroDeck;
      document.querySelector("#liveTitle").textContent = copy[lang].liveTitle;
      document.querySelector("#liveCount").textContent = copy[lang].liveCount;
      document.querySelector("#insightTitle").textContent = copy[lang].insightTitle;
      document.querySelector("#insightCount").textContent = copy[lang].insightCount;
      document.querySelector("#classroomTitle").textContent = copy[lang].classroomTitle;
      document.querySelector("#footerNote").textContent = copy[lang].footer;
      renderLive(dailyData.liveUpdates || []);
      renderInsights(dailyData.insights || dailyData.technical || []);
      renderClassroom(dailyData.classroom || fallback.classroom);
    }

    document.querySelector("#langZh").addEventListener("click", () => setLanguage("zh"));
    document.querySelector("#langEn").addEventListener("click", () => setLanguage("en"));

    loadData().then(data => {
      dailyData = data;
      setLanguage(lang);
    });
  </script>
</body>
</html>
